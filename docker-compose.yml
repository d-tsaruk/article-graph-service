services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-dev-password}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-dev-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # Development defaults so that `docker compose up -d` works out of the box. Override them in .env.
      APP_TOKENS: ${APP_TOKENS:-local-dev-app-token}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-86400}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      JUDGE_MODEL: ${JUDGE_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
      MAX_CHUNKS: ${MAX_CHUNKS:-50}
      STALE_PROCESSING_SECONDS: ${STALE_PROCESSING_SECONDS:-1800}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS:-12000}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-800}
      PDF_MAX_VISUAL_ITEMS: ${PDF_MAX_VISUAL_ITEMS:-30}
      PDF_MIN_IMAGE_SIDE_PX: ${PDF_MIN_IMAGE_SIDE_PX:-100}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-150}
      PDF_MAX_RENDER_SIDE_PX: ${PDF_MAX_RENDER_SIDE_PX:-2048}
      PDF_SCANNED_PAGE_MAX_CHARS: ${PDF_SCANNED_PAGE_MAX_CHARS:-50}
      PDF_DRAWINGS_RENDER_THRESHOLD: ${PDF_DRAWINGS_RENDER_THRESHOLD:-30}
      CHARACTER_CANDIDATE_LIMIT: ${CHARACTER_CANDIDATE_LIMIT:-10}
      RELATION_TYPE_CANDIDATE_SCORE: ${RELATION_TYPE_CANDIDATE_SCORE:-0.75}

volumes:
  neo4j-data:
